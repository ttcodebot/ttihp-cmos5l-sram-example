# Tiny Tapeout project information
project:
  title:        "IHP CMOS5L SRAM demo (256x16)"      # Project title
  author:       "Uri Shaked"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Example of using the IHP RM_IHPSG13_1P_256x16 SRAM macro in a SG13CMOS5L project"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 202x155 uM.
  tiles: "3x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2, 8x2, 3x4, 4x4, 5x4, 6x4 or 8x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_cmos5l_sram_demo"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "sram_bb.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "byte select (0: low, 1: high)"
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: "command bit 0"
  ui[7]: "command bit 1"

  # Outputs
  uo[0]: "read data bit 0"
  uo[1]: "read data bit 1"
  uo[2]: "read data bit 2"
  uo[3]: "read data bit 3"
  uo[4]: "read data bit 4"
  uo[5]: "read data bit 5"
  uo[6]: "read data bit 6"
  uo[7]: "read data bit 7"

  # Bidirectional pins
  uio[0]: "address / write data bit 0"
  uio[1]: "address / write data bit 1"
  uio[2]: "address / write data bit 2"
  uio[3]: "address / write data bit 3"
  uio[4]: "address / write data bit 4"
  uio[5]: "address / write data bit 5"
  uio[6]: "address / write data bit 6"
  uio[7]: "address / write data bit 7"

# Do not change!
yaml_version: 6
